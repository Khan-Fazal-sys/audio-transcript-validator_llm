version: 2
updates:
  # Enable version updates for Python (pip)
  - package-ecosystem: "pip"
    # Look for a `requirements.txt` file in the root directory
    # (Change this to '/' if your requirements.txt is in the root, or '/src' if it's in a subfolder)
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
      day: "monday"
      
  # Optional: Also keep your GitHub Actions up to date!
  - package-ecosystem: "github-actions"
    # Workflow files are usually stored in the `.github/workflows` directory
    directory: "/"
    schedule:
      interval: "weekly"